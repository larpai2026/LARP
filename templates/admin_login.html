<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LARP — вход администратора</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f5f5f5;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:32px;border:1px solid #292929;border-radius:22px;background:#101010;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:27px}p{color:#aaa;margin:0 0 24px}label{display:block;margin:0 0 8px;color:#ddd}input{width:100%;padding:13px 14px;border:1px solid #333;border-radius:12px;background:#080808;color:white;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#6324df;color:white;font:600 16px system-ui;cursor:pointer}.error{padding:10px 12px;margin-bottom:16px;border:1px solid #633;background:#271111;border-radius:10px;color:#ffb9b9}.mark{display:inline-grid;place-items:center;width:52px;height:52px;background:#000;border:1px solid #333;border-radius:12px;font-weight:800;font-size:17px;margin-bottom:18px}
</style></head><body><main class="card"><div class="mark">LARP</div><h1>Вход администратора</h1><p>Эта страница предназначена только владельцу проекта.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" autocomplete="on"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">Пароль администратора</label><input id="password" name="password" type="password" required autocomplete="current-password" autofocus><button type="submit">Войти в панель</button></form></main></body></html>
